<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altifi Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3FF;--card:#fff;--ink:#1E1B3A;--muted:#6B6890;--line:#E3E3F2;
  --pri:#5B5BD6;--pri-d:#4342B0;--sun:#FFC93C;--sun-d:#E0A800;
  --good:#2BB673;--good-d:#1E8E58;--bad:#EF4E4E;--bad-d:#C53333;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#DCDDFE,#FFF1C7);display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
.phone{width:100%;max-width:400px;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){body{align-items:center;padding:20px}.phone{height:820px;max-height:calc(100vh - 40px);border-radius:40px;border:10px solid #1E1B3A;box-shadow:0 30px 60px rgba(30,27,58,.25)}}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:2px solid var(--line);font-weight:900}
.top .logo{color:var(--pri);font-size:20px;letter-spacing:-.5px}
.stats{display:flex;gap:12px;font-size:14px}
.screen{flex:1;overflow-y:auto;padding:16px 16px 28px}
.nav{display:flex;background:#fff;border-top:2px solid var(--line)}
.nav button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--pri)}
.nav button.on span{filter:none;opacity:1}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:16px;font-weight:900;font-size:16px;color:#fff;background:var(--pri);box-shadow:0 4px 0 var(--pri-d);letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.sun{background:var(--sun);color:#4A3300;box-shadow:0 4px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#CFCEE3;box-shadow:0 4px 0 #B3B2CC;color:#fff;transform:none;border-color:transparent}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 4px;font-size:16px}
p{margin:0 0 8px;line-height:1.45}
.hello{display:flex;gap:10px;align-items:center}
.bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;position:relative;flex:1;line-height:1.45}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.unit{border-radius:20px;padding:14px 16px;color:#fff;margin:18px 0 8px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit small{opacity:.85;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:1px}
.unit h3{font-size:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.node{width:70px;height:66px;border-radius:50%;border:none;font-size:28px;position:relative;color:#fff}
.node.locked{background:#D7D6EA;box-shadow:0 6px 0 #B9B8D2;cursor:not-allowed}
.node.done{background:var(--sun);box-shadow:0 6px 0 var(--sun-d)}
.node.current{box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pulse 1.6s infinite}
.node .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:var(--pri);font-size:12px;font-weight:900;padding:4px 10px;border-radius:10px;border:2px solid var(--line);white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.overlay.show{display:flex}
.ohead{display:flex;align-items:center;gap:12px;padding:16px}
.x{border:none;background:none;font-size:24px;color:var(--muted);padding:0 4px}
.prog{flex:1;height:14px;background:#DDDCF0;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:10px;transition:width .3s}
.obody{flex:1;overflow-y:auto;padding:4px 18px 18px}
.ofoot{padding:16px 18px 20px;border-top:2px solid var(--line);background:#fff}
.ofoot.ok{background:#D9F7E7;border-color:#B6EBCF}
.ofoot.no{background:#FFE1E1;border-color:#FBC3C3}
.fb{font-weight:900;font-size:18px;margin-bottom:4px}
.fb + p{font-size:14px;margin-bottom:12px}
.q{font-size:20px;font-weight:900;margin:4px 0 16px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--pri);background:#ECECFF;box-shadow:0 3px 0 #C8C8F5}
.opt.right{border-color:var(--good);background:#D9F7E7}
.opt.wrong{border-color:var(--bad);background:#FFE1E1}
.center{text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;background:#ECECFF;color:var(--pri);margin-top:4px}
.valbar{height:10px;background:#E4E3F3;border-radius:8px;overflow:hidden;margin-top:6px}
.valbar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.badge{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:900;margin:8px auto 10px;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.chatlog{display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-weight:700;font-size:14px;line-height:1.45}
.msg.bot{background:#fff;border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.bot.pro{border-color:#C9B6FF;background:#F7F4FF}
.msg.me{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.mtag{font-size:10px;font-weight:900;color:var(--muted);margin:3px 0 0 42px;letter-spacing:.3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--pri)}
.chatbar{display:flex;gap:8px;padding:10px 16px 14px;background:#fff;border-top:2px solid var(--line)}
.chatbar input{flex:1;font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none}
.chatbar button{border:none;background:var(--pri);color:#fff;border-radius:14px;padding:0 16px;font-weight:900}
.lvlbar{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:12px;font-size:12px;font-weight:800;color:var(--muted)}
.lvlbtn{border:2px solid var(--pri);background:#ECECFF;color:var(--pri);border-radius:999px;padding:6px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0;text-align:center;padding:12px}
.grid b{font-size:22px;display:block}
.toast{position:absolute;top:-120px;left:12px;right:12px;background:rgba(255,255,255,.97);border-radius:18px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;z-index:50;transition:top .4s}
.toast.show{top:12px}
.toast .ic{width:38px;height:38px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.warn{font-size:13px;font-weight:800;color:var(--bad);margin-top:8px}
/* ---- Buddy & character customization ---- */
.mascotbtn{position:relative;border:none;background:none;padding:0;flex:none;border-radius:50%;transition:transform .15s}
.mascotbtn:hover{transform:scale(1.05) rotate(-3deg)}
.mascotbtn:active{transform:scale(.95)}
.editdot{position:absolute;right:0;bottom:4px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 0 var(--line)}
.nav button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:25%}
.chead{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:14px 16px 10px}
.chead b{font-size:18px;text-align:center}
.backbtn{justify-self:start;border:none;background:#fff;border:2px solid var(--line);border-radius:14px;width:44px;height:40px;font-size:20px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.savebtn{justify-self:end;border:none;background:var(--good);color:#fff;font-weight:900;font-size:15px;padding:9px 18px;border-radius:14px;box-shadow:0 4px 0 var(--good-d);opacity:0;transform:scale(.4) translateY(-8px);pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.savebtn.show{opacity:1;transform:none;pointer-events:auto}
.savebtn.done{background:var(--pri);box-shadow:0 4px 0 var(--pri-d)}
.stage{background:radial-gradient(circle at 50% 42%,#fff 0,#E8E9FF 72%);border-radius:28px;padding:14px 0 16px;text-align:center;margin-bottom:14px;border:2px solid var(--line)}
.cprev{display:inline-block}
.cprev.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-4deg)}70%{transform:scale(.96) rotate(2deg)}100%{transform:scale(1)}}
.nametag{display:inline-block;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 18px;font-weight:900;font-size:18px}
.namebox{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:16px}
.namebox:focus-within{border-color:var(--pri)}
.namebox label{font-weight:900;font-size:14px;color:var(--muted);white-space:nowrap}
.namebox input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:17px;font-weight:800;color:var(--ink);padding:8px 4px;background:none}
.dice{border:none;background:var(--bg);border-radius:12px;font-size:20px;width:46px;height:42px}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:none}
.ctab{flex:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:900;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.ctab.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri-d)}
.ctab .e{font-size:18px}
.sub{font-weight:900;font-size:13px;color:var(--muted);margin:10px 2px 10px;text-transform:uppercase;letter-spacing:.6px}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{position:relative;border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 4px 9px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--ink)}
.tile .timg{height:66px;width:100%;display:flex;align-items:center;justify-content:center}
.tile .none{font-size:30px;opacity:.5}
.tile.on{border-color:var(--pri);background:#ECECFF;box-shadow:0 3px 0 #C8C8F5}
.tile.on:after{content:"✓";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.linkbtn{display:block;margin:10px auto 0;border:none;background:none;color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline}
.modalbg{position:absolute;inset:0;background:rgba(30,27,58,.45);display:flex;align-items:flex-end;z-index:30}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:20px 18px 24px;text-align:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .btn{margin-top:10px}
.minitoast{position:absolute;left:50%;top:66px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:12px;white-space:nowrap;z-index:60;animation:fadeio 1.9s forwards;pointer-events:none}
@keyframes fadeio{0%{opacity:0;transform:translate(-50%,-8px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* ---- Lessons: mixed exercise types ---- */
.ltag{font-weight:900;font-size:12px;letter-spacing:1px;color:var(--pri);margin:2px 0 6px}
.scene{border-radius:24px;padding:20px 12px;text-align:center;font-size:50px;line-height:1.2;margin:4px 0 14px;background:linear-gradient(160deg,#E8E9FF,#FFF1C7);border:2px solid var(--line);animation:pop .4s}
.scene .cap{font-size:13px;font-weight:800;color:var(--muted);margin-top:8px;line-height:1.3}
.learnt{font-size:22px;font-weight:900;margin:2px 0 8px}
.ltext{font-size:16px;font-weight:700;line-height:1.5}
.ltext b{color:var(--pri)}
.icons3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.icons3 .card{margin:0;text-align:center;padding:10px 6px;font-size:12px;font-weight:800;line-height:1.3}
.icons3 .card div{font-size:30px;margin-bottom:4px}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 8px 12px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:14px;color:var(--ink)}
.pic div{font-size:48px;line-height:1.1;margin-bottom:6px}
.pic.sel,.mbtn.sel{border-color:var(--pri);background:#ECECFF;box-shadow:0 4px 0 #C8C8F5}
.pic.right,.oslot.right{border-color:var(--good);background:#D9F7E7;box-shadow:0 4px 0 #B6EBCF}
.pic.wrong,.oslot.wrong{border-color:var(--bad);background:#FFE1E1;box-shadow:0 4px 0 #FBC3C3}
.sortwrap{position:relative;height:214px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.sortcount{position:absolute;top:0;right:0;font-weight:900;font-size:13px;color:var(--muted)}
.sortcard{width:200px;height:190px;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-align:center;padding:10px;transition:transform .32s ease-in,opacity .32s;animation:pop .3s}
.sortcard div{font-size:70px;line-height:1.1;margin-bottom:8px}
.sortcard.ok{border-color:var(--good);background:#D9F7E7}
.sortcard.no{border-color:var(--bad);background:#FFE1E1}
.bucketrow{display:flex;gap:10px}
.bucket{flex:1;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px 6px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.bucket span{font-size:28px}
.bucket:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.srow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;margin-bottom:8px;font-weight:800;font-size:14px;border:2px solid}
.srow.ok{background:#EAFBF2;border-color:#B6EBCF}
.srow.no{background:#FFF0F0;border-color:#FBC3C3}
.srow .se{font-size:24px}
.srow b{font-size:12px;white-space:nowrap}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mbtn{min-height:62px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 10px;font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 3px 0 var(--line);line-height:1.3}
.mbtn.gone{opacity:.35;border-color:var(--good);background:#D9F7E7;box-shadow:none;pointer-events:none}
.mbtn.bad{border-color:var(--bad);background:#FFE1E1;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.oslots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.oslot{display:flex;align-items:center;gap:10px;min-height:52px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px 12px;font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;width:100%}
.oslot.empty{border-style:dashed;box-shadow:none;background:transparent;color:#B3B2CC;font-weight:900}
.oslot .num{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.oslot .e{font-size:24px}
.opool{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.sval{text-align:center;font-size:34px;font-weight:900;color:var(--pri);margin:8px 0}
.range{width:100%;accent-color:var(--pri);height:28px}
.rlab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}
.remain{text-align:center;font-weight:800;margin-bottom:12px}
.jars{display:flex;gap:10px;align-items:flex-end}
.jar{flex:1;text-align:center;font-weight:800}
.jarval{font-size:12px;margin-bottom:4px}
.jarlid{height:10px;margin:0 8px;background:#C9C8E0;border-radius:6px 6px 2px 2px}
.jarbody{height:150px;border:3px solid #C9C8E0;border-top-width:1px;border-radius:4px 4px 24px 24px;position:relative;overflow:hidden;background:#fff}
.jarbody i{position:absolute;left:0;right:0;bottom:0;transition:height .3s}
.jarbody .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--ink)}
.jarlab{font-size:13px;margin:6px 0}
.stepper{display:flex;gap:6px;justify-content:center}
.stepper button{width:40px;height:36px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px;color:var(--pri);box-shadow:0 3px 0 var(--line)}
.jart{font-size:12px;font-weight:900;padding:4px;border-radius:8px}
.jart.ok{background:#D9F7E7;color:var(--good-d)}.jart.no{background:#FFE1E1;color:var(--bad-d)}
.post{background:#fff;border:2px solid var(--line);border-radius:20px;overflow:hidden}
.phead{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line)}
.pav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FF6FA5,#FFC93C);display:flex;align-items:center;justify-content:center;font-size:22px}
.pbody{padding:14px;font-size:16px;line-height:2.2;font-weight:700}
.flag{padding:3px 6px;border-radius:8px;cursor:pointer;border:2px dashed #D7D6EA;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.flag.sel{background:#FFE9B0;border-color:#F2A33A;border-style:solid}
.flag.isflag{background:#FFE1E1;border-color:var(--bad);border-style:solid}
.flag.notflag{text-decoration:line-through;opacity:.6}
.pfoot{padding:10px 14px;border-top:2px solid var(--line);font-size:13px;font-weight:800;color:var(--muted)}
.receipt{background:#FFFDF6;border:2px dashed #E8DDB8;border-radius:18px;padding:10px}
.rhead{font-weight:900;text-align:center;padding:6px 0 10px;border-bottom:2px dashed #E8DDB8;margin-bottom:8px}
.ritem{display:flex;gap:10px;align-items:center;width:100%;border:2px solid transparent;background:none;border-radius:12px;padding:9px 8px;font-weight:800;font-size:14px;color:var(--ink)}
.ritem span:first-child{font-size:22px}
.ritem.sel{background:#FFE9B0;border-color:#F2A33A}
.ritem.isflag{background:#FFE1E1;border-color:var(--bad)}
.ritem.notflag{opacity:.55;text-decoration:line-through}
.split{display:flex;border-radius:14px;overflow:hidden;font-size:13px;font-weight:900;color:#fff;line-height:1.3}
.split i{font-style:normal;padding:18px 4px}

/* ---- Life game (My City) ---- */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.hud .card{margin:0;padding:8px 10px}
.hud .muted{font-size:11px;font-weight:900}
.hud b{display:block;font-size:16px}
.rankcard{padding:12px 14px;margin-bottom:10px}
.ladder{display:flex;gap:3px}
.ladder i{width:9px;height:18px;border-radius:4px;background:#E4E3F3}
.ladder i.on{background:var(--sun)}
.town{position:relative;border-radius:24px;overflow:hidden;border:2px solid var(--line);margin-bottom:12px;background:#A5DC86}
.town svg.map{display:block;width:100%;height:auto}
.bld{cursor:pointer}
.bld:hover{filter:brightness(1.06)}
.mark{animation:bobm .5s infinite alternate;transform-box:fill-box}
@keyframes bobm{to{transform:translateY(-5px)}}
.avatar{position:absolute;transform:translate(-50%,-94%);transition:left var(--d,.6s) linear,top var(--d,.6s) linear;pointer-events:none;z-index:3}
.flipper{transition:transform .15s}
.avatar.flip .flipper{transform:scaleX(-1)}
.avatar.walk .bobber{animation:bob .22s infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(3deg)}}
.avtip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-size:11px;font-weight:900;white-space:nowrap}
.todo{display:flex;flex-direction:column;gap:8px}
.todoi{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:20px;color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left}
.todoi span{flex:1;font-size:14px}
.todoi b{font-size:12px;color:var(--muted)}
.todoi.done{opacity:.6}
.gsheet{text-align:left;max-height:90%;overflow-y:auto}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead .ic{font-size:34px}
.shead h2{margin:0}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 4px 0 var(--line);line-height:1.35}
.choice span{font-size:30px;flex:none}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.paper{background:#FFFBEF;border:2px solid #E8DDB8;border-radius:16px;padding:14px;margin-bottom:12px;text-align:center}
.paper .mast{font-family:Georgia,serif;font-weight:700;font-size:12px;letter-spacing:2px;border-bottom:3px double #1E1B3A;padding-bottom:6px;margin-bottom:8px}
.paper .hl{font-family:Georgia,serif;font-weight:900;font-size:24px;line-height:1.1;margin:8px 0 4px}
.paper .yr{display:inline-block;background:#1E1B3A;color:#FFC93C;font-weight:900;font-size:12px;border-radius:8px;padding:3px 8px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 8px;text-align:center;font-weight:800;font-size:13px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.item div{font-size:34px}
.item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.item:disabled{opacity:.45}
.moneyrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px solid var(--line);font-weight:800;font-size:14px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{font-size:14px;padding:12px 6px;margin-top:0}
.effs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eff{font-size:12px;font-weight:900;padding:4px 8px;border-radius:8px}
.eff.up{background:#D9F7E7;color:var(--good-d)}.eff.down{background:#FFE1E1;color:var(--bad-d)}
.confetti{font-size:30px;letter-spacing:6px;animation:pop .5s}
.recap{background:#ECECFF;border:2px solid #C8C8F5;border-radius:16px;padding:12px;margin-top:4px;font-weight:700;font-size:14px;line-height:1.45}
.recap b{color:var(--pri)}
.side{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.side>span{font-size:28px;line-height:1}
.side p{margin:2px 0 0;font-weight:700;font-size:13px;line-height:1.4;color:var(--muted)}
.ratechip{margin-top:8px;font-size:12px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:10px;padding:6px 8px}
.fact{background:#FFF7DC;border:2px solid #FBE6A2;border-radius:16px;padding:12px;margin-top:12px;font-weight:700;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div class="phone">
  <div class="top" id="top"></div>
  <div class="screen" id="screen"></div>
  <div id="chatbarSlot"></div>
  <nav class="nav">
    <button data-t="learn" onclick="go('learn')"><span>📚</span>Learn</button>
    <button data-t="city" onclick="go('city')"><span>🏙️</span>My City</button>
    <button data-t="chat" onclick="go('chat')"><span>🪙</span>Ask Tiko</button>
    <button data-t="me" onclick="go('me')"><span>👤</span>Me</button>
  </nav>
  <div class="overlay" id="overlay"></div>
  <div id="modal"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------- Mascot: a coin buddy the user can rename & dress up ---------- */
const INK="#2A1B00", MOUTH="#5A3B00";
const ln=(d,c=MOUTH,w=4)=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const ROUND_EYES=`<ellipse cx="38" cy="47" rx="5" ry="6.5" fill="${INK}"/><ellipse cx="62" cy="47" rx="5" ry="6.5" fill="${INK}"/><circle cx="39.6" cy="44.5" r="1.8" fill="#fff"/><circle cx="63.6" cy="44.5" r="1.8" fill="#fff"/>`;
const EYES={
  round:{n:"Round",svg:ROUND_EYES},
  sparkly:{n:"Sparkly",svg:`<ellipse cx="38" cy="47" rx="6.5" ry="8" fill="${INK}"/><ellipse cx="62" cy="47" rx="6.5" ry="8" fill="${INK}"/><circle cx="40" cy="44" r="2.6" fill="#fff"/><circle cx="64" cy="44" r="2.6" fill="#fff"/><circle cx="36" cy="50" r="1.3" fill="#fff"/><circle cx="60" cy="50" r="1.3" fill="#fff"/>`},
  happy:{n:"Happy",svg:ln("M32 49 Q38 41 44 49",INK)+ln("M56 49 Q62 41 68 49",INK)},
  sleepy:{n:"Sleepy",svg:ln("M32 46 Q38 52 44 46",INK)+ln("M56 46 Q62 52 68 46",INK)},
  wink:{n:"Wink",svg:`<ellipse cx="38" cy="47" rx="5" ry="6.5" fill="${INK}"/><circle cx="39.6" cy="44.5" r="1.8" fill="#fff"/>`+ln("M56 49 Q62 41 68 49",INK)},
  cool:{n:"Cool",svg:`<path d="M32 45 H44 Q44 52 38 52 Q32 52 32 45Z" fill="${INK}"/><path d="M56 45 H68 Q68 52 62 52 Q56 52 56 45Z" fill="${INK}"/>`}
};
const MOUTHS={
  smile:{n:"Smile",svg:ln("M38 57 Q50 70 62 57")},
  grin:{n:"Big grin",svg:`<path d="M38 57 L62 57 Q62 72 50 72 Q38 72 38 57Z" fill="${MOUTH}"/><ellipse cx="50" cy="68" rx="6" ry="3.4" fill="#FF7B7B"/>`},
  silly:{n:"Silly",svg:`<path d="M47 61 Q46 71 51.5 71 Q57 71 56 61Z" fill="#FF7B7B"/>`+ln("M40 58 Q50 65 60 58")},
  cat:{n:"Kitty",svg:ln("M40 58 Q45 64 50 58 Q55 64 60 58")},
  ooh:{n:"Ooh",svg:`<ellipse cx="50" cy="62" rx="5" ry="6" fill="${MOUTH}"/>`},
  calm:{n:"Calm",svg:ln("M43 61 H57")}
};
const COLORS={
  gold:{n:"Gold",main:"#FFC93C",dark:"#E0A800",ring:"#F5B400"},
  mint:{n:"Mint",main:"#7EE0B5",dark:"#3FBF88",ring:"#5ED3A0"},
  sky:{n:"Sky",main:"#8EC5FF",dark:"#4C93E6",ring:"#6FAEF5"},
  pink:{n:"Bubblegum",main:"#FFB3C7",dark:"#E57A9A",ring:"#F598B2"},
  grape:{n:"Grape",main:"#C9B6FF",dark:"#8E72E6",ring:"#B09BF7"},
  silver:{n:"Silver",main:"#E6E9F0",dark:"#A9AFC0",ring:"#CBD0DC"}
};
const heart=(cx,cy,s)=>`M${cx} ${cy+7*s} C${cx-13*s} ${cy-s} ${cx-7*s} ${cy-11*s} ${cx} ${cy-4*s} C${cx+7*s} ${cy-11*s} ${cx+13*s} ${cy-s} ${cx} ${cy+7*s}Z`;
const star=(x,y,r)=>`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z`;
const petals=[0,72,144,216,288].map(a=>`<circle cx="${(79+6.5*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(28+6.5*Math.sin(a*Math.PI/180)).toFixed(1)}" r="5.5" fill="#FF8FB1"/>`).join("");
const ACC={
  hat:[
    {id:"party",n:"Party hat",vb:"24 -18 52 48",svg:`<g transform="rotate(8 50 20)"><polygon points="36,26 64,26 50,-8" fill="#FF6FA5"/>${ln("M41 16 H59","#fff",3)}${ln("M45 6 H55","#fff",3)}<circle cx="50" cy="-9" r="5" fill="#FFE066"/></g>`},
    {id:"crown",n:"Crown",vb:"24 -2 52 34",svg:`<polygon points="30,28 30,8 40,17 50,2 60,17 70,8 70,28" fill="#FFD54F" stroke="#C99400" stroke-width="2.5" stroke-linejoin="round"/><circle cx="40" cy="23" r="2.8" fill="#EF4E4E"/><circle cx="50" cy="22" r="3.2" fill="#5B5BD6"/><circle cx="60" cy="23" r="2.8" fill="#2BB673"/>`},
    {id:"cap",n:"Cap",vb:"20 0 76 36",svg:`<path d="M24 29 C24 4 76 4 76 29 Z" fill="#3D5AFE"/><path d="M62 27 Q88 23 93 32 Q76 34 62 31Z" fill="#2A3FC0"/><circle cx="50" cy="8" r="3" fill="#2A3FC0"/>`},
    {id:"beanie",n:"Beanie",vb:"16 -8 68 46",svg:`<path d="M22 32 C22 2 78 2 78 32 Z" fill="#EF4E4E"/><rect x="19" y="25" width="62" height="11" rx="5.5" fill="#C53333"/>${ln("M36 12 V24","#D84444",2.5)}${ln("M50 7 V24","#D84444",2.5)}${ln("M64 12 V24","#D84444",2.5)}<circle cx="50" cy="1" r="7" fill="#fff" stroke="#E3E3F2" stroke-width="1.5"/>`},
    {id:"grad",n:"Graduate",vb:"6 -4 90 40",svg:`<path d="M30 14 L30 27 Q50 34 70 27 L70 14Z" fill="#2C2850"/><polygon points="50,0 90,12 50,24 10,12" fill="#1E1B3A"/>${ln("M50 12 L82 14 L82 29","#FFC93C",2.5)}<circle cx="82" cy="31" r="3.5" fill="#FFC93C"/><circle cx="50" cy="12" r="2.5" fill="#FFC93C"/>`}
  ],
  glasses:[
    {id:"round",n:"Round",vb:"14 32 72 30",svg:`<circle cx="38" cy="47" r="10" fill="rgba(255,255,255,.35)" stroke="#1E1B3A" stroke-width="3"/><circle cx="62" cy="47" r="10" fill="rgba(255,255,255,.35)" stroke="#1E1B3A" stroke-width="3"/>${ln("M48 46 Q50 43 52 46","#1E1B3A",3)}${ln("M28 45 L18 42","#1E1B3A",3)}${ln("M72 45 L82 42","#1E1B3A",3)}`},
    {id:"sun",n:"Shades",vb:"14 34 72 26",svg:`<path d="M24 40 H48 V47 Q48 56 37 56 Q26 56 24 47Z" fill="#1E1B3A"/><path d="M52 40 H76 V47 Q74 56 63 56 Q52 56 52 47Z" fill="#1E1B3A"/>${ln("M48 43 H52","#1E1B3A",3)}${ln("M24 41 L17 39","#1E1B3A",3)}${ln("M76 41 L83 39","#1E1B3A",3)}${ln("M29 44 H34","#fff",2)}${ln("M57 44 H62","#fff",2)}`},
    {id:"heart",n:"Hearts",vb:"18 30 64 32",svg:`<path d="${heart(38,47,1.25)}" fill="#FF4F8B" stroke="#D6336C" stroke-width="2"/><path d="${heart(62,47,1.25)}" fill="#FF4F8B" stroke="#D6336C" stroke-width="2"/>${ln("M48 45 H52","#D6336C",2.5)}`}
  ],
  extra:[
    {id:"bow",n:"Bow tie",vb:"28 76 44 30",svg:`<path d="M50 91 L35 83 Q32 91 35 99Z" fill="#5B5BD6"/><path d="M50 91 L65 83 Q68 91 65 99Z" fill="#5B5BD6"/><circle cx="50" cy="91" r="4.5" fill="#4342B0"/>`},
    {id:"flower",n:"Flower",vb:"62 11 34 34",svg:`${petals}<circle cx="79" cy="28" r="4.5" fill="#FFE680"/>`},
    {id:"phones",n:"Headphones",vb:"4 4 92 66",svg:`<path d="M16 52 C16 4 84 4 84 52" stroke="#1E1B3A" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="8" y="42" width="15" height="24" rx="7" fill="#5B5BD6"/><rect x="77" y="42" width="15" height="24" rx="7" fill="#5B5BD6"/>`},
    {id:"sparkle",n:"Sparkles",vb:"0 0 60 50",tile:`<path d="${star(22,22,14)}" fill="#FFD54F"/><path d="${star(46,14,8)}" fill="#8EC5FF"/><path d="${star(44,38,7)}" fill="#FF8FB1"/>`,svg:`<path d="${star(8,22,8)}" fill="#FFD54F"/><path d="${star(94,66,7)}" fill="#FFD54F"/><path d="${star(88,10,5)}" fill="#8EC5FF"/><path d="${star(6,78,5)}" fill="#FF8FB1"/>`}
  ]
};
const accOf=(part,id)=>ACC[part].find(a=>a.id===id);
const defaultM=()=>({name:"Tiko",color:"gold",eyes:"round",mouth:"smile",hat:null,glasses:null,extra:null});
const SPROUT=`<path d="M50 18 L50 12" stroke="#1E8E58" stroke-width="3" stroke-linecap="round"/><path d="M50 13 C44 3 33 5 32 11 C40 12 45 13 50 13Z" fill="#2BB673"/><path d="M50 13 C56 3 67 5 68 11 C60 12 55 13 50 13Z" fill="#45CC88"/>`;
function tiko(size=80,mood="happy",cfg){
  cfg=cfg||(S&&S.m)||defaultM();
  const c=COLORS[cfg.color]||COLORS.gold;
  const eyes=(EYES[cfg.eyes]||EYES.round).svg;
  const mouth = mood==="sad" ? ln("M40 63 Q50 55 60 63") : mood==="wow" ? MOUTHS.ooh.svg : (MOUTHS[cfg.mouth]||MOUTHS.smile).svg;
  const hat=cfg.hat&&accOf("hat",cfg.hat), gl=cfg.glasses&&accOf("glasses",cfg.glasses), ex=cfg.extra&&accOf("extra",cfg.extra);
  return `<svg width="${size}" height="${size}" viewBox="-10 -18 120 120" aria-hidden="true" style="flex:none;overflow:visible">
    ${hat?"":SPROUT}
    <circle cx="50" cy="57" r="36" fill="${c.dark}"/>
    <circle cx="50" cy="54" r="36" fill="${c.main}"/>
    <circle cx="50" cy="54" r="28" fill="none" stroke="${c.ring}" stroke-width="3" stroke-dasharray="4 5"/>
    ${eyes}
    <ellipse cx="28" cy="58" rx="5" ry="3" fill="#FF8A80" opacity=".7"/><ellipse cx="72" cy="58" rx="5" ry="3" fill="#FF8A80" opacity=".7"/>
    ${mouth}${gl?gl.svg:""}${hat?hat.svg:""}${ex?ex.svg:""}</svg>`;
}
const BN=()=>esc((S.m&&S.m.name)||"Tiko");

/* ---------- Player character (for the life game) ---------- */
const SKINS={s1:"#FFE3CC",s2:"#F6C9A0",s3:"#E2A878",s4:"#B97A50",s5:"#8A5534"};
const HAIRC={black:"#2B2233",brown:"#7A4A2A",blonde:"#E9BE58",red:"#C8553D",pink:"#F48FB1",blue:"#5C8DF0"};
const OUTFITS={sky:"#6FAEF5",mint:"#4CC79A",sun:"#FFC93C",rose:"#FF8FA3",grape:"#9B87F5",white:"#F4F4FA"};
const PANTS={navy:"#2C3E73",denim:"#4A6FA5",khaki:"#B89B6A",black:"#2B2233"};
const HAIRS={short:"Short",long:"Long",bun:"Bun",spiky:"Spiky",bob:"Bob",curly:"Curly"};
const AVACC={none:"None",glasses:"Glasses",cap:"Cap",bow:"Bow",flower:"Flower"};
const defaultLook=()=>({skin:"s2",hair:"short",hc:"black",shirt:"sky",pants:"navy",acc:"none"});
function avatar(lk,w=48,rank=0){
  const sk=SKINS[lk.skin]||SKINS.s2, hc=HAIRC[lk.hc]||HAIRC.black, sh=OUTFITS[lk.shirt]||OUTFITS.sky, pa=PANTS[lk.pants]||PANTS.navy, hs=lk.hair;
  let back="",front="";
  if(hs==="long") back=`<path d="M12 26 Q12 7 30 7 Q48 7 48 26 L50 58 Q42 62 37 52 L23 52 Q18 62 10 58Z" fill="${hc}"/>`;
  if(hs==="bob") back=`<path d="M11 26 Q11 7 30 7 Q49 7 49 26 L49 41 Q30 46 11 41Z" fill="${hc}"/>`;
  if(hs==="bun") back=`<circle cx="30" cy="6" r="7.5" fill="${hc}"/>`;
  if(hs==="short"||hs==="bun") front=`<path d="M13 28 Q11 8 30 8 Q49 8 47 28 Q45 19 36 17 Q28 21 18 19 Q14 22 13 28Z" fill="${hc}"/>`;
  if(hs==="long"||hs==="bob") front=`<path d="M13 27 Q12 9 30 9 Q48 9 47 27 Q41 17 31 18 Q21 17 13 27Z" fill="${hc}"/>`;
  if(hs==="spiky") front=`<path d="M13 28 L12 15 L18 17 L19 7 L25 12 L30 3 L35 12 L41 7 L42 17 L48 15 L47 28 Q42 19 30 19 Q18 19 13 28Z" fill="${hc}"/>`;
  if(hs==="curly") front=[[13,27],[15,19],[20,12],[27,9],[34,9],[41,12],[45,19],[47,27]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.5" fill="${hc}"/>`).join("");
  let acc="";
  if(lk.acc==="glasses") acc=`<g fill="rgba(255,255,255,.3)" stroke="#1E1B3A" stroke-width="1.6"><circle cx="24" cy="29.5" r="5"/><circle cx="36" cy="29.5" r="5"/></g><path d="M29 29.5 H31" stroke="#1E1B3A" stroke-width="1.6"/>`;
  if(lk.acc==="cap") acc=`<path d="M12 22 Q12 4 30 4 Q48 4 48 22Z" fill="#EF4E4E"/><path d="M30 19 Q50 17 55 23 Q44 24 30 22Z" fill="#C53333"/><circle cx="30" cy="5" r="2" fill="#C53333"/>`;
  if(lk.acc==="bow") acc=`<g transform="translate(41 11) rotate(20)"><path d="M0 0 L-8 -5 L-8 5Z" fill="#FF6FA5"/><path d="M0 0 L8 -5 L8 5Z" fill="#FF6FA5"/><circle r="2.6" fill="#E04F87"/></g>`;
  if(lk.acc==="flower") acc=`<g transform="translate(43 13)">${[0,72,144,216,288].map(a=>`<circle cx="${(4*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(4*Math.sin(a*Math.PI/180)).toFixed(1)}" r="3.4" fill="#fff" stroke="#F7C6D8" stroke-width=".8"/>`).join("")}<circle r="2.4" fill="#FFD54F"/></g>`;
  const armC = rank>=4 ? "#2C2850" : sh;
  const blazer = rank>=4 ? `<path d="M17 66 Q17 46 26 45 L30 57 L28 66Z" fill="#2C2850"/><path d="M43 66 Q43 46 34 45 L30 57 L32 66Z" fill="#2C2850"/>` : "";
  const tie = rank>=2 ? `<path d="M26.5 45 L30 49 L33.5 45Z" fill="#fff"/><path d="M30 48 L28 51 L30 61 L32 51Z" fill="${rank>=4?"#FFC93C":"#EF4E4E"}"/>` : "";
  const crown = rank>=5 && lk.acc!=="cap" ? `<path d="M22 8 L22 0 L26 4 L30 -3 L34 4 L38 0 L38 8Z" fill="#FFD54F" stroke="#C99400" stroke-width="1.2" stroke-linejoin="round"/>` : "";
  return `<svg width="${w}" height="${Math.round(w*86/60)}" viewBox="0 -6 60 86" aria-hidden="true" style="overflow:visible;display:block">
    <ellipse cx="30" cy="77" rx="15" ry="3.5" fill="rgba(0,0,0,.18)"/>
    <rect x="22" y="62" width="7" height="13" rx="3" fill="${pa}"/><rect x="31" y="62" width="7" height="13" rx="3" fill="${pa}"/>
    <ellipse cx="25" cy="75.5" rx="5" ry="2.6" fill="#3A2E4A"/><ellipse cx="35" cy="75.5" rx="5" ry="2.6" fill="#3A2E4A"/>
    ${back}
    <ellipse cx="15.5" cy="55" rx="4" ry="7.5" fill="${armC}"/><ellipse cx="44.5" cy="55" rx="4" ry="7.5" fill="${armC}"/>
    <circle cx="15.5" cy="62" r="3.3" fill="${sk}"/><circle cx="44.5" cy="62" r="3.3" fill="${sk}"/>
    <path d="M17 66 Q17 44 30 44 Q43 44 43 66Z" fill="${sh}"/>
    ${blazer}${tie}
    <rect x="27" y="40" width="6" height="6" fill="${sk}"/>
    <circle cx="12.5" cy="29" r="3.5" fill="${sk}"/><circle cx="47.5" cy="29" r="3.5" fill="${sk}"/>
    <circle cx="30" cy="27" r="17" fill="${sk}"/>
    ${front}
    <ellipse cx="24" cy="29.5" rx="2.2" ry="2.9" fill="#2A1B00"/><ellipse cx="36" cy="29.5" rx="2.2" ry="2.9" fill="#2A1B00"/>
    <circle cx="24.8" cy="28.4" r=".8" fill="#fff"/><circle cx="36.8" cy="28.4" r=".8" fill="#fff"/>
    <ellipse cx="20" cy="34.5" rx="3" ry="1.8" fill="#FF8A80" opacity=".55"/><ellipse cx="40" cy="34.5" rx="3" ry="1.8" fill="#FF8A80" opacity=".55"/>
    <path d="M27 35.5 Q30 38.5 33 35.5" stroke="#7A3B2A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    ${acc}${crown}</svg>`;
}

/* ---------- State ---------- */
const KEY="altifi-demo-v2";
const fresh=()=>({xp:0,streak:1,done:0,lastDay:new Date().toDateString(),lastOpen:Date.now(),m:defaultM(),life:null,lvl:"auto"});
let S=null;

function compoundArt(){
  const yrs=[0,2,4,6,8,10],max=Math.pow(1.06,10);let g="";
  yrs.forEach((t,i)=>{const s=1+0.06*t,c=Math.pow(1.06,t),x=22+i*46,h1=s/max*110,h2=c/max*110;
    g+=`<rect x="${x}" y="${(130-h1).toFixed(1)}" width="16" height="${h1.toFixed(1)}" rx="4" fill="#B3B2CC"/><rect x="${x+18}" y="${(130-h2).toFixed(1)}" width="16" height="${h2.toFixed(1)}" rx="4" fill="#2BB673"/><text x="${x+17}" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#6B6890">${t}y</text>`});
  return `<svg viewBox="0 0 300 175" width="100%" style="max-width:300px">${g}<g font-size="11" font-weight="800"><rect x="40" y="158" width="10" height="10" rx="2" fill="#B3B2CC"/><text x="54" y="167" fill="#6B6890">Simple</text><rect x="120" y="158" width="10" height="10" rx="2" fill="#2BB673"/><text x="134" y="167" fill="#6B6890">Compound (6%/yr)</text></g></svg>`;
}

    h+=`<div class="unit" style="background:${u.color}"><small>Unit ${ui+1}</small><h3>${u.title}</h3><div style="font-weight:700;font-size:13px;opacity:.9">${u.desc}</div></div><div class="path">`;
    [0,1].forEach(k=>{
      const i=ui*2+k, off=[0,-50,50,0][(i)%4];
      const st=i<S.done?"done":i===S.done?"current":"locked";
      h+=`<button class="node ${st}" style="margin-left:${off*2}px;${st==="current"?`background:${u.color}`:""}" ${st==="locked"?"disabled":`onclick="startLesson(${i})"`} aria-label="${LESSONS[i].name}">

let L=null;
const curStep=()=>LESSONS[L.i].steps[L.s];
function startLesson(i){L={i,s:0,ok:0,graded:0};initStep();lessonRender()}
function initStep(){
  const st=curStep(); L.checked=false; L.right=false; L.st={};
  if(st.t==="pick") L.st.sel=null;
  if(st.t==="mcq"){L.st.order=shuffle(st.o.map((_,k)=>k));L.st.sel=null}
  if(st.t==="sort"){L.st.items=shuffle(st.items);L.st.idx=0;L.st.res=[];L.st.busy=false}
  if(st.t==="match"){L.st.left=shuffle(st.pairs.map((_,k)=>k));L.st.rightO=shuffle(st.pairs.map((_,k)=>k));L.st.done=[];L.st.miss=0;L.st.sl=null;L.st.sr=null;L.st.bad=null}
  if(st.t==="order"){L.st.pool=shuffle(st.items.map((_,k)=>k));L.st.picked=[]}
  if(st.t==="slider") L.st.v=st.start!==undefined?st.start:st.min;
  if(st.t==="jars") L.st.vals=st.jars.map(()=>0);
  if(st.t==="spot"||st.t==="tap") L.st.sel=[];
}
function lessonRender(){
  const les=LESSONS[L.i], st=curStep(), pct=(L.s/les.steps.length)*100;

function lsSet(k,v){if(L.checked)return;L.st[k]=v;lessonRender()}
function finishStep(right){L.checked=true;L.right=right;L.graded++;if(right)L.ok++;lessonRender()}
function checkStep(){
  const st=curStep(); let r=false;
  if(st.t==="pick") r=L.st.sel===st.a;
  if(st.t==="mcq") r=L.st.order[L.st.sel]===st.a;
  if(st.t==="order") r=L.st.picked.every((k,p)=>k===p);
  if(st.t==="slider") r=Math.abs(L.st.v-st.a)<=st.tol;
  if(st.t==="jars") r=st.jars.every((j,k)=>L.st.vals[k]===j[2]);
  if(st.t==="spot"||st.t==="tap"){const list=st.t==="spot"?st.post.parts:st.items,fi=st.t==="spot"?1:3;const want=list.map((p,k)=>p[fi]?k:-1).filter(k=>k>=0);r=want.length===L.st.sel.length&&want.every(k=>L.st.sel.includes(k))}
  finishStep(r);
}
function sortPick(b){
  if(L.checked||L.st.busy)return; const st=curStep(), it=L.st.items[L.st.idx], ok=b===it[2], c=$("#sc");
  L.st.busy=true; L.st.res.push(b);
  if(c){c.classList.add(ok?"ok":"no");const dx=st.buckets.length===2?(b===0?-260:260):(b-1)*260;setTimeout(()=>{c.style.transform=`translate(${dx}px,${b===1&&st.buckets.length===3?140:40}px) rotate(${dx/14}deg)`;c.style.opacity="0"},220)}
  setTimeout(()=>{L.st.busy=false;L.st.idx++;
    if(L.st.idx>=L.st.items.length){const wrong=L.st.items.filter((x,k)=>L.st.res[k]!==x[2]).length;finishStep(wrong<=(L.st.items.length>=6?1:0))}
    else lessonRender()},560);
}
function matchTap(side,k){
  if(L.checked||L.st.done.includes(k))return;
  L.st.bad=null;
  if(side==="l")L.st.sl=k;else L.st.sr=k;
  if(L.st.sl!==null&&L.st.sr!==null){
    if(L.st.sl===L.st.sr)L.st.done.push(k);
    else{L.st.miss++;L.st.bad={l:L.st.sl,r:L.st.sr}}
    L.st.sl=null;L.st.sr=null;
    if(L.st.done.length===curStep().pairs.length)return finishStep(L.st.miss<=1);
  }
  lessonRender();
}
function orderPick(k){if(L.checked)return;L.st.picked.push(k);lessonRender()}
function orderUn(p){if(L.checked)return;L.st.picked.splice(p,1);lessonRender()}
function jarStep(k,d){
  if(L.checked)return; const st=curStep(),sum=L.st.vals.reduce((a,b)=>a+b,0);
  if(d>0&&sum+st.step>st.total)return; if(d<0&&L.st.vals[k]<=0)return;
  L.st.vals[k]+=d*st.step; lessonRender();
}
function tapToggle(k){if(L.checked)return;const i=L.st.sel.indexOf(k);if(i>=0)L.st.sel.splice(i,1);else L.st.sel.push(k);lessonRender()}
function nextStep(){
  L.s++;
  if(L.s<LESSONS[L.i].steps.length){initStep();return lessonRender()}

    <p class="muted">${L.ok} of ${L.graded} exercises perfect</p>

    <div class="ofoot"><button class="btn" onclick="closeO()">CONTINUE</button></div>`);
}

  showModal(`${shead("🛒","Market","Wallet: "+vnd(l.cash))}<div class="shopgrid">${SHOP.map((it,i)=>`<button class="item" onclick="buy(${i})" ${l.cash<it.p?"disabled":""}><div>${it.e}</div>${it.n}<small>${short(it.p)} · ${it.perf?`+${it.perf} perf`:`+${it.mood} mood`}</small></button>`).join("")}</div>
   <p class="muted" style="font-size:12px;font-weight:700;margin:12px 0 0">😊 Wants lift your mood (low mood hurts your work). 📈 Courses boost performance. 🏠 Rent & food (${vnd(billsNow())}) are paid automatically at month end.</p>
   <button class="btn" style="margin-top:12px" onclick="closeModal()">DONE</button>`);
}
function buy(i){
  const it=SHOP[i],l=S.life; if(l.cash<it.p)return;
  l.cash-=it.p; l.spent+=it.p; if(it.mood)l.mood=clamp(l.mood+it.mood,0,100); if(it.perf&&!isOwner(l))l.perf+=it.perf; save();
  mtoast(l.cash<billsNow()&&!isOwner(l)&&l.cash+JOB[l.rank].pay<billsNow()?`${it.e} Bought! ⚠️ Careful, rent is due soon`:`${it.e} ${it.n} · ${it.perf?`+${it.perf} perf`:`+${it.mood} mood`}`);
  const p=checkPromo(); if(p) return p==="promo"?showPromo():founderOffer();
  openMarket();
}
function monthIncome(l){
  if(isOwner(l)){const p=bizProfit(l);return {inc:p.profit-p.li,p}}
  return {inc:JOB[l.rank].pay,p:null};
}
function openHome(){
  const l=S.life,b=billsNow(),{inc,p}=monthIncome(l),est=l.cash+inc-b;
  showModal(`${shead("🏠","Home sweet home","End of month "+l.month)}
   ${p?`<div class="moneyrow"><span>🏪 Business profit after loan interest</span><span style="color:${inc<0?"var(--bad)":"var(--good)"}">${inc<0?"":"+"}${vnd(inc)}</span></div>`:`<div class="moneyrow"><span>💼 Salary (${titleOf(l)})</span><span style="color:var(--good)">+${vnd(inc)}</span></div>`}
   <div class="moneyrow"><span>🏠 Rent</span><span style="color:var(--bad)">−${vnd(RENT)}</span></div>
   <div class="moneyrow"><span>🍚 Food & bills</span><span style="color:var(--bad)">−${vnd(FOOD)}</span></div>
   <div class="moneyrow" style="border:none"><span>Cash after this month</span><b style="color:${est<0?"var(--bad)":"var(--ink)"}">${vnd(est)}</b></div>
   ${!l.worked&&!isOwner(l)?`<div class="warn">You haven't made this month's move! Skipping costs −10 performance.</div>`:""}
   <button class="btn sun" style="margin-top:14px" onclick="endMonth()">🌙 SLEEP & END MONTH</button>
   <button class="btn ghost" onclick="closeModal();openCreator(false)">👕 CHANGE MY LOOK</button>
   <button class="linkbtn" onclick="closeModal()">Not yet</button>`);
}
function endMonth(){
  const l=S.life,bills=billsNow(),rBefore=rateNow(l.month),interest=Math.round(l.save*depRate(l)),{inc,p}=monthIncome(l);
  l.cash+=inc-bills; l.save+=interest;
  if(!l.worked&&!isOwner(l))l.perf=Math.max(0,l.perf-10);
  let debtInt=0; if(l.cash<0){debtInt=Math.round(-l.cash*0.03);l.cash-=debtInt}
  l.mood=clamp(l.mood-12,0,100);
  if(l.costMod>0)l.costMod--;
  const sum={m:l.month,inc,p,bills,interest,debtInt,spent:l.spent,skipped:!l.worked&&!isOwner(l),nw:l.cash+l.save-(l.biz?l.biz.loan:0)};
  l.month++; l.worked=false; l.spent=0; l.curW=null; l.pos="home"; save();
  const rAfter=rateNow(l.month), up=rAfter>rBefore;
  const tip=up?`The central bank raised rates to ${pctY(rAfter)}! ${l.dep==="fixed"?"Your fixed savings stay at 6%.":"Your floating savings now earn more."}${l.biz&&l.biz.lt==="floating"?" But your floating loan just got more expensive.":""}`
    :l.cash<0?"You ended the month in debt. Debt grows 3% a month — spend less on wants until it's gone."
    :l.mood<30?"You're burning out 😩. Spending a little on things you enjoy is part of a healthy budget too."
    :sum.interest===0?"Your money isn't working for you yet. Put some savings in the bank to earn interest!"
    :"Nice month! Keep learning — new lessons unlock new cases. 💪";
  showModal(`<div class="center">${tiko(76,l.cash<0||l.mood<30?"sad":"wow")}<h2>Month ${sum.m} report</h2></div>
   ${p?`<div class="moneyrow"><span>🏪 Business revenue</span><span style="color:var(--good)">+${vnd(p.rev)}</span></div><div class="moneyrow"><span>🧾 Business costs</span><span style="color:var(--bad)">−${vnd(p.cost)}</span></div><div class="moneyrow"><span>🏦 Loan interest</span><span style="color:var(--bad)">−${vnd(p.li)}</span></div>`
      :`<div class="moneyrow"><span>💼 Salary</span><span style="color:var(--good)">+${vnd(sum.inc)}</span></div>`}
   <div class="moneyrow"><span>🏠 Rent & food</span><span style="color:var(--bad)">−${vnd(sum.bills)}</span></div>
   <div class="moneyrow"><span>🛍️ Spent at the market</span><span>${vnd(sum.spent)}</span></div>
   <div class="moneyrow"><span>📈 Savings interest</span><span style="color:var(--good)">+${vnd(sum.interest)}</span></div>
   ${sum.debtInt?`<div class="moneyrow"><span>💳 Debt interest (3%)</span><span style="color:var(--bad)">−${vnd(sum.debtInt)}</span></div>`:""}
   ${sum.skipped?`<div class="moneyrow"><span>🏢 Skipped work</span><span style="color:var(--bad)">−10 perf</span></div>`:""}
   <div class="moneyrow" style="border:none"><span>💎 Net worth${l.biz?" (minus loans)":""}</span><b>${vnd(sum.nw)}</b></div>
   <div class="hello" style="margin-top:10px">${tiko(46)}<div class="bubble">${tip}</div></div>
   <button class="btn" style="margin-top:14px" onclick="closeModal()">START MONTH ${l.month} →</button>`);
}

 [["inflation","price go up","prices","cpi","fisher"],{

  p:"Inflation is a sustained increase in the general price level, typically measured by a consumer price index (CPI) — the cost of a representative basket of goods. Its key implication is the gap between nominal and real returns: by the Fisher approximation, real rate ≈ nominal rate − expected inflation. Moderate, predictable inflation is generally compatible with growth, which is why most central banks target a low positive rate; high or volatile inflation erodes savings, distorts price signals and redistributes wealth from creditors to debtors. A good follow-up: why do central banks raise interest rates to fight it?"}],

function cycleLvl(){
  const order=["auto","n","l","p"]; S.lvl=order[(order.indexOf(S.lvl)+1)%order.length]; save();
  mtoast(S.lvl==="auto"?`Auto: ${LV[autoLvl()].label}`:`${LV[S.lvl].label} mode`); render();
}
function sendChat(q){
  const i=$("#ci"); const t=(q||(i&&i.value)||"").trim(); if(!t)return;
  chat.push({b:0,t}); chat.push({b:1,typing:true}); render();
  setTimeout(()=>{
    const low=t.toLowerCase(); let lv=curLvl(), bumped=false;
    if(lv!=="p"&&ADV.some(w=>low.includes(w))){lv="p";bumped=true}
    const hit=KB.find(([ks])=>ks.some(k=>low.includes(k)));
    chat.pop(); chat.push({b:1,t:hit?hit[1][lv]:FALLBACK[lv],lv,bumped});
    render(); const n=$("#ci"); n&&n.focus();
  },800);
}

  const l=S.life, t=new Date(S.lastOpen).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  return `<div class="card center">${l?`<div style="display:inline-block">${avatar(l.look,84,avR(l))}</div>`:""}<h2 style="margin-top:6px">${esc(l?l.name:"Minh Hân")}</h2><p class="muted" style="font-weight:700;margin-bottom:12px">${l?`${titleOf(l)} in Altifi City · Month ${l.month}`:"No character yet"}</p>${l?`<button class="btn ghost" onclick="openCreator(false)">👕 CHANGE MY CHARACTER</button>`:`<button class="btn sun" onclick="openCreator(true)">CREATE MY CHARACTER</button>`}</div>
   <div class="card"><div class="hello"><button class="mascotbtn" onclick="openCustom()" aria-label="Customize your buddy">${tiko(70)}<span class="editdot">✏️</span></button><div><h3>Your buddy: ${BN()}</h3><p class="muted" style="font-weight:700;margin:0">Tap to change its name & look</p></div></div></div>
   <div class="grid" style="margin-bottom:14px">
    <div class="card"><b>🔥 ${S.streak}</b><span class="muted">day streak</span></div>
    <div class="card"><b style="color:var(--sun-d)">⭐ ${S.xp}</b><span class="muted">total XP</span></div>
    <div class="card"><b>${S.done}/${LESSONS.length}</b><span class="muted">lessons</span></div>
    <div class="card"><b style="font-size:18px">${l?short(l.cash+l.save):"—"}</b><span class="muted">net worth in game</span></div></div>
   <div class="card"><h3>🔔 Daily reminder</h3><p class="muted" style="font-weight:700">We'll nudge you tomorrow at <b style="color:var(--ink)">${t}</b> — the same time you opened Altifi today. If you were free then, you'll probably be free again!</p><button class="btn ghost" onclick="toast()">PREVIEW NOTIFICATION</button></div>
   <button class="btn bad" onclick="resetDemo()">RESET DEMO</button>`;
}
function toast(){
  const el=$("#toast");
  el.innerHTML=`<div class="ic">${tiko(30)}</div><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)"><span>ALTIFI</span><span>now</span></div><div style="font-weight:900;font-size:14px">${BN()} misses you! 🪙</div><div style="font-size:13px;font-weight:700">5 minutes today keeps your 🔥 ${S.streak}-day streak alive.</div></div>`;
  el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),3500);
}
function resetDemo(){S=fresh();save();chat=chat.slice(0,1);tab="learn";render()}

/* ---------- Buddy customization page ---------- */
let D=null, cTab="face";
const NAMES=["Tiko","Xu","Bơ","Mochi","Penny","Coco","Lucky","Bún","Nugget","Sunny"];
const CTABS=[["face","😊","Face"],["color","🎨","Color"],["hat","🎩","Hats"],["glasses","👓","Glasses"],["extra","🎀","Extras"]];
const isDirty=()=>JSON.stringify({...D,name:D.name.trim()})!==JSON.stringify(S.m);

function openCustom(){
  D=clone(S.m); cTab="face";
  openO(`<div class="chead"><button class="backbtn" onclick="custBack()" aria-label="Back">←</button><b>My Buddy</b><button class="savebtn" id="savebtn" onclick="custSave()">Save</button></div>
    <div class="obody">
      <div class="stage"><div class="cprev" id="cprev">${tiko(170,"happy",D)}</div><div><span class="nametag" id="cname">${esc(D.name)}</span></div></div>
      <div class="namebox"><label for="nameIn">✏️ Name</label><input id="nameIn" maxlength="12" autocomplete="off" value="${esc(D.name)}" oninput="D.name=this.value;refresh(false)" placeholder="Give me a name!"><button class="dice" onclick="randName()" aria-label="Random name">🎲</button></div>
      <div class="ctabs" id="ctabs"></div>
      <div id="ctiles"></div>
      <button class="linkbtn" onclick="resetBuddy()">↺ Back to the original look</button>
    </div><div id="cmodal"></div>`);
  drawTabs(); drawTiles();
}
function drawTabs(){
  $("#ctabs").innerHTML=CTABS.map(([k,e,n])=>`<button class="ctab ${cTab===k?"on":""}" onclick="cTab='${k}';drawTabs();drawTiles()"><span class="e">${e}</span>${n}</button>`).join("");
}
const tile=(on,img,label,click)=>`<button class="tile ${on?"on":""}" onclick="${click}"><div class="timg">${img}</div>${label}</button>`;
function drawTiles(){
  let h="";
  if(cTab==="face"){
    h+=`<div class="sub">Eyes</div><div class="tilegrid">`+Object.entries(EYES).map(([k,v])=>tile(D.eyes===k,tiko(66,"happy",{...D,eyes:k,hat:null,glasses:null,extra:null}),v.n,`setPart('eyes','${k}')`)).join("")+`</div>`;
    h+=`<div class="sub">Mouth</div><div class="tilegrid">`+Object.entries(MOUTHS).map(([k,v])=>tile(D.mouth===k,tiko(66,"happy",{...D,mouth:k,hat:null,glasses:null,extra:null}),v.n,`setPart('mouth','${k}')`)).join("")+`</div>`;
  } else if(cTab==="color"){
    h+=`<div class="sub">Pick a color</div><div class="tilegrid">`+Object.entries(COLORS).map(([k,v])=>tile(D.color===k,tiko(66,"happy",{...D,color:k}),v.n,`setPart('color','${k}')`)).join("")+`</div>`;
  } else {
    const label={hat:"Tap a hat to try it on",glasses:"Tap glasses to try them on",extra:"Tap to add something fun"}[cTab];
    h+=`<div class="sub">${label}</div><div class="tilegrid">`+tile(!D[cTab],`<span class="none">🚫</span>`,"None",`setPart('${cTab}',null)`)
      +ACC[cTab].map(a=>tile(D[cTab]===a.id,`<svg width="70" height="58" viewBox="${a.vb}" aria-hidden="true">${a.tile||a.svg}</svg>`,a.n,`setPart('${cTab}','${a.id}')`)).join("")+`</div>`;
  }
  $("#ctiles").innerHTML=h;
}
function setPart(part,val){
  if(["hat","glasses","extra"].includes(part)&&val&&D[part]===val) val=null;
  D[part]=val; drawTiles(); refresh(true);
}
function refresh(bump){
  const p=$("#cprev"); if(!p)return;
  p.innerHTML=tiko(170,"happy",D);
  $("#cname").textContent=D.name.trim()||"…";
  if(bump){p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump")}
  $("#savebtn").classList.toggle("show",isDirty());
}
function randName(){
  let n; do{n=NAMES[Math.floor(Math.random()*NAMES.length)]}while(n===D.name&&NAMES.length>1);
  D.name=n; $("#nameIn").value=n; refresh(true);
}
function resetBuddy(){D=defaultM(); $("#nameIn").value=D.name; drawTiles(); refresh(true)}
function custSave(){
  D.name=D.name.trim()||"Tiko"; $("#nameIn").value=D.name;
  S.m=clone(D); save();
  const b=$("#savebtn"); b.textContent="✓ Saved"; b.classList.add("done");
  const p=$("#cprev"); p.innerHTML=tiko(170,"wow",D); p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");
  mtoast(`Looking great, ${D.name}! 🎉`);
  setTimeout(()=>{b.classList.remove("show");setTimeout(()=>{b.textContent="Save";b.classList.remove("done");if(p.isConnected)p.innerHTML=tiko(170,"happy",D)},300)},1100);
}
function custBack(){
  if(!isDirty()) return closeO();
  $("#cmodal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)this.remove()"><div class="sheet">
    <div style="display:inline-block">${tiko(80,"sad",D)}</div>
    <h2>Leave without saving?</h2><p class="muted" style="font-weight:700">Your changes to ${esc(D.name.trim()||"your buddy")} will be lost.</p>
    <button class="btn good" onclick="document.getElementById('cmodal').innerHTML='';custSave()">SAVE CHANGES</button>
    <button class="btn ghost" onclick="closeO()">LEAVE WITHOUT SAVING</button></div></div>`;
}

/* ---------- Upgrade saves from older versions ---------- */
(function migrate(){
  const o=S.life; if(!o)return;
  try{
    const fresh=newLife(o.name||"Minh Hân",o.look||defaultLook());
    const keep=o.caseDone?o:{name:fresh.name,look:fresh.look,month:o.month,cash:o.cash,save:o.save,mood:o.mood,rank:Math.min(o.rank||0,JOB.length-1)};
    S.life=Object.assign(fresh,keep);
    const l=S.life;
    if(typeof l.cash!=="number")l.cash=2000000; if(typeof l.save!=="number")l.save=0; if(typeof l.mood!=="number")l.mood=70;
    l.rank=clamp(l.rank||0,0,JOB.length-1); if(!POS[l.pos])l.pos="home";
    if(l.phase==="owner"&&!(l.biz&&BIZ[l.biz.type])){l.phase="emp";l.biz=null}
    if(l.curW&&!(WORK[l.curW[0]]&&WORK[l.curW[0]][l.curW[1]]))l.curW=null;
  }catch(e){S.life=null}
  save();
})();
window.addEventListener("error",e=>{try{mtoast("⚠️ "+(e.message||"Error"))}catch(_){}});

render();
</script>
</body>
</html>
