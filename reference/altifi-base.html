<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altifi Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3FF;--card:#fff;--ink:#1E1B3A;--muted:#6B6890;--line:#E3E3F2;
  --pri:#5B5BD6;--pri-d:#4342B0;--sun:#FFC93C;--sun-d:#E0A800;
  --good:#2BB673;--good-d:#1E8E58;--bad:#EF4E4E;--bad-d:#C53333;
  --soft:#ECECFF;--softd:#C8C8F5;--okbg:#D9F7E7;--okline:#B6EBCF;--nobg:#FFE1E1;--noline:#FBC3C3;--track:#E4E3F3;
  --sunbg:#FFF7DC;--sunline:#FBE6A2;--lock:#D7D6EA;--lockd:#B9B8D2;--okt:#1E8E58;--not:#C53333;--glass:rgba(242,243,255,.84);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#DCDDFE,#FFF1C7);display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
.phone{width:100%;max-width:400px;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){body{align-items:center;padding:20px}.phone{height:820px;max-height:calc(100vh - 40px);border-radius:40px;border:10px solid #1E1B3A;box-shadow:0 30px 60px rgba(30,27,58,.25)}}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border-bottom:2px solid var(--line);font-weight:900}
.top .logo{color:var(--pri);font-size:20px;letter-spacing:-.5px}
.stats{display:flex;gap:12px;font-size:14px}
.screen{flex:1;overflow-y:auto;padding:16px 16px 28px}
.nav{display:flex;background:var(--card);border-top:2px solid var(--line)}
.nav button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--pri)}
.nav button.on span{filter:none;opacity:1}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:16px;font-weight:900;font-size:16px;color:#fff;background:var(--pri);box-shadow:0 4px 0 var(--pri-d);letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.sun{background:var(--sun);color:#4A3300;box-shadow:0 4px 0 var(--sun-d)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#CFCEE3;box-shadow:0 4px 0 #B3B2CC;color:#fff;transform:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 4px;font-size:16px}
p{margin:0 0 8px;line-height:1.45}
.hello{display:flex;gap:10px;align-items:center}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;position:relative;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.unit{border-radius:20px;padding:14px 16px;color:#fff;margin:18px 0 8px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit small{opacity:.85;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:1px}
.unit h3{font-size:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.node{width:70px;height:66px;border-radius:50%;border:none;font-size:28px;position:relative;color:#fff}
.node.locked{background:var(--lock);box-shadow:0 6px 0 var(--lockd);cursor:not-allowed}
.node.done{background:var(--sun);box-shadow:0 6px 0 var(--sun-d)}
.node.current{box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pulse 1.6s infinite;margin-top:20px}
.node .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--pri);font-size:12px;font-weight:900;padding:4px 10px;border-radius:10px;border:2px solid var(--line);white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.overlay.show{display:flex}
.ohead{display:flex;align-items:center;gap:12px;padding:16px}
.x{border:none;background:none;font-size:24px;color:var(--muted);padding:0 4px}
.prog{flex:1;height:14px;background:var(--track);border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:10px;transition:width .3s}
.obody{flex:1;overflow-y:auto;padding:4px 18px 18px}
.ofoot{padding:16px 18px 20px;border-top:2px solid var(--line);background:var(--card)}
.ofoot.ok{background:var(--okbg);border-color:var(--okline)}
.ofoot.no{background:var(--nobg);border-color:var(--noline)}
.fb{font-weight:900;font-size:18px;margin-bottom:4px}
.fb + p{font-size:14px;margin-bottom:12px}
.q{font-size:21px;font-weight:900;margin:10px 0 18px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--pri);background:var(--soft);box-shadow:0 3px 0 var(--softd)}
.opt.right{border-color:var(--good);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--nobg)}
.center{text-align:center}
.big{font-size:44px;font-weight:900;margin:6px 0}
.case{display:flex;gap:12px;align-items:center;cursor:pointer}
.case .yr{font-size:26px;font-weight:900;color:#fff;border-radius:16px;padding:12px 10px;min-width:82px;text-align:center}
.case .meta{flex:1}
.pill{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--pri);margin-top:4px}
.valbar{height:12px;background:var(--track);border-radius:8px;overflow:hidden;margin-top:6px}
.valbar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.timerwrap{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.timerwrap .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
textarea{background:var(--card);width:100%;font-family:inherit;font-size:16px;font-weight:700;padding:14px;border-radius:16px;border:2px solid var(--line);resize:none;height:110px;color:var(--ink);outline:none}
textarea:focus{border-color:var(--pri)}
.count{text-align:right;font-size:12px;font-weight:800;color:var(--muted);margin:4px 2px 0}
.badge{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:900;margin:8px auto 10px;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.mini{width:30px;height:30px;font-size:13px;margin:0;animation:none;box-shadow:none;flex:none}
.reviewrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);font-weight:800;font-size:14px}
.reviewrow:last-child{border:none}
.chatlog{display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-weight:700;font-size:14px;line-height:1.45}
.msg.bot{background:var(--card);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--pri)}
.chatbar{display:flex;gap:8px;padding:10px 16px 14px;background:var(--card);border-top:2px solid var(--line)}
.chatbar input{background:var(--bg);color:var(--ink);flex:1;font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none}
.chatbar button{border:none;background:var(--pri);color:#fff;border-radius:14px;padding:0 16px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0;text-align:center;padding:12px}
.grid b{font-size:22px;display:block}
.toast{position:absolute;top:-120px;left:12px;right:12px;background:rgba(255,255,255,.97);border-radius:18px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;z-index:50;transition:top .4s}
.toast.show{top:12px}
.toast .ic{width:38px;height:38px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.warn{font-size:13px;font-weight:800;color:var(--bad);margin-top:8px}
/* ---- Buddy customization ---- */
.mascotbtn{position:relative;border:none;background:none;padding:0;flex:none;border-radius:50%;transition:transform .15s}
.mascotbtn:hover{transform:scale(1.05) rotate(-3deg)}
.mascotbtn:active{transform:scale(.95)}
.editdot{position:absolute;right:0;bottom:4px;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 0 var(--line)}
.nav button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20%}
.chead{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:14px 16px 10px}
.chead b{font-size:18px;text-align:center}
.backbtn{justify-self:start;border:none;background:var(--card);border:2px solid var(--line);border-radius:14px;width:44px;height:40px;font-size:20px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.savebtn{justify-self:end;border:none;background:var(--good);color:#fff;font-weight:900;font-size:15px;padding:9px 18px;border-radius:14px;box-shadow:0 4px 0 var(--good-d);opacity:0;transform:scale(.4) translateY(-8px);pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.savebtn.show{opacity:1;transform:none;pointer-events:auto}
.savebtn.done{background:var(--pri);box-shadow:0 4px 0 var(--pri-d)}
.savebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--good-d)}
.stage{background:radial-gradient(circle at 50% 42%,var(--card) 0,var(--soft) 72%);border-radius:28px;padding:14px 0 16px;text-align:center;margin-bottom:14px;border:2px solid var(--line)}
.cprev{display:inline-block}
.cprev.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-4deg)}70%{transform:scale(.96) rotate(2deg)}100%{transform:scale(1)}}
.nametag{display:inline-block;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 18px;font-weight:900;font-size:18px}
.namebox{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:16px}
.namebox:focus-within{border-color:var(--pri)}
.namebox label{font-weight:900;font-size:14px;color:var(--muted);white-space:nowrap}
.namebox input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:17px;font-weight:800;color:var(--ink);padding:8px 4px;background:none}
.dice{border:none;background:var(--bg);border-radius:12px;font-size:20px;width:46px;height:42px}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:none}
.ctab{flex:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-weight:900;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.ctab.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri-d)}
.ctab .e{font-size:18px}
.sub{font-weight:900;font-size:13px;color:var(--muted);margin:6px 2px 10px;text-transform:uppercase;letter-spacing:.6px}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{position:relative;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:8px 4px 9px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--ink)}
.tile .timg{height:66px;width:100%;display:flex;align-items:center;justify-content:center}
.tile .none{font-size:30px;opacity:.5}
.tile.on{border-color:var(--pri);background:var(--soft);box-shadow:0 3px 0 var(--softd)}
.tile.on:after{content:"✓";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.linkbtn{display:block;margin:4px auto 0;border:none;background:none;color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline}
.modalbg{position:absolute;inset:0;background:rgba(30,27,58,.45);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:20px 18px 24px;text-align:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .btn{margin-top:10px}
.minitoast{position:absolute;left:50%;top:66px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:12px;white-space:nowrap;z-index:25;animation:fadeio 1.9s forwards;pointer-events:none}
@keyframes fadeio{0%{opacity:0;transform:translate(-50%,-8px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* ---- v3: themes ---- */
body.night{--bg:#1F2128;--card:#2A2D37;--ink:#ECEDF6;--muted:#A4A7BA;--line:#3A3E4B;--pri:#6E6EE6;--pri-d:#4B4BB8;--soft:#33365A;--softd:#4A4E80;--okbg:#1D3A2C;--okline:#2C5A44;--nobg:#45272A;--noline:#6A3A3F;--track:#3A3E4B;--sunbg:#38321F;--sunline:#5A4D2A;--lock:#454859;--lockd:#34374A;--okt:#5FE0A0;--not:#FF8A8A;--glass:rgba(31,33,40,.86);background:linear-gradient(160deg,#2B2D3A,#14151B)}
body.night .btn:disabled{background:#454859;box-shadow:0 4px 0 #34374A;color:#8A8DA0}
body.night .tile.on:after,body.night .themecard.on:after{border-color:var(--card)}
body.imgbg .phone,body.imgbg .overlay{background:linear-gradient(rgba(242,243,255,.22),rgba(242,243,255,.22)),var(--bgimg) center/cover no-repeat}
body.imgbg .top,body.imgbg .nav{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 6px 24px rgba(20,20,40,.14)}
body.imgbg .top{margin:10px 10px 0;border-radius:22px}
body.imgbg .nav{margin:0 10px 10px;border-radius:26px}
/* ---- buddy talk & emotions ---- */
.talk{min-height:44px;display:flex;align-items:center}
.bubble.sm{font-size:13px;padding:8px 11px;min-height:40px}
.bubble.sm:before{top:12px}
.say{animation:sayin .28s ease-out}
@keyframes sayin{from{opacity:0;transform:translateY(5px) scale(.96)}}
.budrow{display:flex;gap:10px;align-items:center;margin:2px 0 10px}
.bud{flex:none;line-height:0}
.lname{font-weight:800;font-size:13px}
.m-laugh svg{animation:laugh .45s ease-in-out 4}
@keyframes laugh{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateY(-3px)}75%{transform:rotate(9deg) translateY(-3px)}}
.m-sad svg{animation:droop 2.4s ease forwards}
@keyframes droop{0%{transform:none}12%,85%{transform:translateY(5px) scale(.93)}100%{transform:none}}
.m-cheer svg{animation:hop .4s ease 2}
@keyframes hop{50%{transform:translateY(-9px) scale(1.06)}}
/* ---- effects (Potato Mode off) ---- */
.pop{animation:popb .32s ease}
@keyframes popb{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.wave{animation:wave .8s ease-in-out}
@keyframes wave{0%,100%{transform:none}20%{transform:translateY(-5px) skewY(.8deg)}40%{transform:translateY(4px) skewY(-.7deg)}60%{transform:translateY(-2px) skewY(.35deg)}80%{transform:translateY(1px) skewY(-.15deg)}}
.fxin{animation:up .28s ease-out}
body.potato .pop,body.potato .wave,body.potato .fxin,body.potato .say{animation:none!important}
/* ---- settings ---- */
.setlist{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.setrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.si{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.st{flex:1;display:flex;flex-direction:column;min-width:0}
.st b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st small{color:var(--muted);font-weight:700;font-size:13px}
.chev{font-size:28px;color:var(--muted);font-weight:900;line-height:1}
.sw{width:52px;height:31px;border-radius:999px;background:var(--lock);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .22s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--good)}
.sw.on i{left:24px}
.ilogo,.infobtn i{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:700;line-height:1}
.si .ilogo{font-size:25px;color:#fff}
.backlink{border:none;background:none;color:var(--pri);font-weight:900;font-size:16px;padding:0;margin-bottom:10px}
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.themecard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 3px 0 var(--line);color:var(--ink);font-weight:900;font-size:15px;display:flex;flex-direction:column;gap:8px;align-items:center}
.themecard.on{border-color:var(--pri);box-shadow:0 3px 0 var(--pri-d)}
.themecard.on:after{content:"✓";position:absolute;top:-9px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mock{width:100%;height:150px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.1)}
.mock .mt,.mock .mn{height:15px;flex:none}
.mock .mb{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.mock .mc{height:20px;border-radius:6px}
.upload{width:100%;border:2.5px dashed var(--line);background:var(--card);border-radius:18px;padding:22px 14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:16px}
.upload span{font-size:36px;line-height:1.1}
.upload small{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.alertbg{position:absolute;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:60;padding:30px;animation:fadein .2s}
.permbox{background:rgba(248,248,250,.97);border-radius:16px;width:272px;text-align:center;overflow:hidden;color:#111;animation:popb .28s ease;font-family:-apple-system,system-ui,sans-serif}
.permbox .pb{padding:18px 16px 14px}
.permbox b{display:block;font-size:16px;margin-bottom:6px}
.permbox p{font-size:13px;margin:0;color:#333}
.permbtns{display:flex;border-top:1px solid rgba(0,0,0,.15)}
.permbtns button{flex:1;border:none;background:none;padding:12px;font-size:17px;color:#0A7AFF;font-family:inherit}

<script>
/* ---------- Mascot: a coin buddy the user can rename & dress up ---------- */
const INK="#2A1B00", MOUTH="#5A3B00";
const ln=(d,c=MOUTH,w=4)=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const ROUND_EYES=`<ellipse cx="38" cy="47" rx="5" ry="6.5" fill="${INK}"/><ellipse cx="62" cy="47" rx="5" ry="6.5" fill="${INK}"/><circle cx="39.6" cy="44.5" r="1.8" fill="#fff"/><circle cx="63.6" cy="44.5" r="1.8" fill="#fff"/>`;
const EYES={
  round:{n:"Round",svg:ROUND_EYES},
  sparkly:{n:"Sparkly",svg:`<ellipse cx="38" cy="47" rx="6.5" ry="8" fill="${INK}"/><ellipse cx="62" cy="47" rx="6.5" ry="8" fill="${INK}"/><circle cx="40" cy="44" r="2.6" fill="#fff"/><circle cx="64" cy="44" r="2.6" fill="#fff"/><circle cx="36" cy="50" r="1.3" fill="#fff"/><circle cx="60" cy="50" r="1.3" fill="#fff"/>`},
  happy:{n:"Happy",svg:ln("M32 49 Q38 41 44 49",INK)+ln("M56 49 Q62 41 68 49",INK)},
  sleepy:{n:"Sleepy",svg:ln("M32 46 Q38 52 44 46",INK)+ln("M56 46 Q62 52 68 46",INK)},
  wink:{n:"Wink",svg:`<ellipse cx="38" cy="47" rx="5" ry="6.5" fill="${INK}"/><circle cx="39.6" cy="44.5" r="1.8" fill="#fff"/>`+ln("M56 49 Q62 41 68 49",INK)},
  cool:{n:"Cool",svg:`<path d="M32 45 H44 Q44 52 38 52 Q32 52 32 45Z" fill="${INK}"/><path d="M56 45 H68 Q68 52 62 52 Q56 52 56 45Z" fill="${INK}"/>`}
};
const MOUTHS={
  smile:{n:"Smile",svg:ln("M38 57 Q50 70 62 57")},
  grin:{n:"Big grin",svg:`<path d="M38 57 L62 57 Q62 72 50 72 Q38 72 38 57Z" fill="${MOUTH}"/><ellipse cx="50" cy="68" rx="6" ry="3.4" fill="#FF7B7B"/>`},
  silly:{n:"Silly",svg:`<path d="M47 61 Q46 71 51.5 71 Q57 71 56 61Z" fill="#FF7B7B"/>`+ln("M40 58 Q50 65 60 58")},
  cat:{n:"Kitty",svg:ln("M40 58 Q45 64 50 58 Q55 64 60 58")},
  ooh:{n:"Ooh",svg:`<ellipse cx="50" cy="62" rx="5" ry="6" fill="${MOUTH}"/>`},
  calm:{n:"Calm",svg:ln("M43 61 H57")}
};
const COLORS={
  gold:{n:"Gold",main:"#FFC93C",dark:"#E0A800",ring:"#F5B400"},
  mint:{n:"Mint",main:"#7EE0B5",dark:"#3FBF88",ring:"#5ED3A0"},
  sky:{n:"Sky",main:"#8EC5FF",dark:"#4C93E6",ring:"#6FAEF5"},
  pink:{n:"Bubblegum",main:"#FFB3C7",dark:"#E57A9A",ring:"#F598B2"},
  grape:{n:"Grape",main:"#C9B6FF",dark:"#8E72E6",ring:"#B09BF7"},
  silver:{n:"Silver",main:"#E6E9F0",dark:"#A9AFC0",ring:"#CBD0DC"}
};
const heart=(cx,cy,s)=>`M${cx} ${cy+7*s} C${cx-13*s} ${cy-s} ${cx-7*s} ${cy-11*s} ${cx} ${cy-4*s} C${cx+7*s} ${cy-11*s} ${cx+13*s} ${cy-s} ${cx} ${cy+7*s}Z`;
const star=(x,y,r)=>`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z`;
const petals=[0,72,144,216,288].map(a=>`<circle cx="${(79+6.5*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(28+6.5*Math.sin(a*Math.PI/180)).toFixed(1)}" r="5.5" fill="#FF8FB1"/>`).join("");
const ACC={
  hat:[
    {id:"party",n:"Party hat",vb:"24 -18 52 48",svg:`<g transform="rotate(8 50 20)"><polygon points="36,26 64,26 50,-8" fill="#FF6FA5"/>${ln("M41 16 H59","#fff",3)}${ln("M45 6 H55","#fff",3)}<circle cx="50" cy="-9" r="5" fill="#FFE066"/></g>`},
    {id:"crown",n:"Crown",vb:"24 -2 52 34",svg:`<polygon points="30,28 30,8 40,17 50,2 60,17 70,8 70,28" fill="#FFD54F" stroke="#C99400" stroke-width="2.5" stroke-linejoin="round"/><circle cx="40" cy="23" r="2.8" fill="#EF4E4E"/><circle cx="50" cy="22" r="3.2" fill="#5B5BD6"/><circle cx="60" cy="23" r="2.8" fill="#2BB673"/>`},
    {id:"cap",n:"Cap",vb:"20 0 76 36",svg:`<path d="M24 29 C24 4 76 4 76 29 Z" fill="#3D5AFE"/><path d="M62 27 Q88 23 93 32 Q76 34 62 31Z" fill="#2A3FC0"/><circle cx="50" cy="8" r="3" fill="#2A3FC0"/>`},
    {id:"beanie",n:"Beanie",vb:"16 -8 68 46",svg:`<path d="M22 32 C22 2 78 2 78 32 Z" fill="#EF4E4E"/><rect x="19" y="25" width="62" height="11" rx="5.5" fill="#C53333"/>${ln("M36 12 V24","#D84444",2.5)}${ln("M50 7 V24","#D84444",2.5)}${ln("M64 12 V24","#D84444",2.5)}<circle cx="50" cy="1" r="7" fill="#fff" stroke="#E3E3F2" stroke-width="1.5"/>`},
    {id:"grad",n:"Graduate",vb:"6 -4 90 40",svg:`<path d="M30 14 L30 27 Q50 34 70 27 L70 14Z" fill="#2C2850"/><polygon points="50,0 90,12 50,24 10,12" fill="#1E1B3A"/>${ln("M50 12 L82 14 L82 29","#FFC93C",2.5)}<circle cx="82" cy="31" r="3.5" fill="#FFC93C"/><circle cx="50" cy="12" r="2.5" fill="#FFC93C"/>`}
  ],
  glasses:[
    {id:"round",n:"Round",vb:"14 32 72 30",svg:`<circle cx="38" cy="47" r="10" fill="rgba(255,255,255,.35)" stroke="#1E1B3A" stroke-width="3"/><circle cx="62" cy="47" r="10" fill="rgba(255,255,255,.35)" stroke="#1E1B3A" stroke-width="3"/>${ln("M48 46 Q50 43 52 46","#1E1B3A",3)}${ln("M28 45 L18 42","#1E1B3A",3)}${ln("M72 45 L82 42","#1E1B3A",3)}`},
    {id:"sun",n:"Shades",vb:"14 34 72 26",svg:`<path d="M24 40 H48 V47 Q48 56 37 56 Q26 56 24 47Z" fill="#1E1B3A"/><path d="M52 40 H76 V47 Q74 56 63 56 Q52 56 52 47Z" fill="#1E1B3A"/>${ln("M48 43 H52","#1E1B3A",3)}${ln("M24 41 L17 39","#1E1B3A",3)}${ln("M76 41 L83 39","#1E1B3A",3)}${ln("M29 44 H34","#fff",2)}${ln("M57 44 H62","#fff",2)}`},
    {id:"heart",n:"Hearts",vb:"18 30 64 32",svg:`<path d="${heart(38,47,1.25)}" fill="#FF4F8B" stroke="#D6336C" stroke-width="2"/><path d="${heart(62,47,1.25)}" fill="#FF4F8B" stroke="#D6336C" stroke-width="2"/>${ln("M48 45 H52","#D6336C",2.5)}`}
  ],
  extra:[
    {id:"bow",n:"Bow tie",vb:"28 76 44 30",svg:`<path d="M50 91 L35 83 Q32 91 35 99Z" fill="#5B5BD6"/><path d="M50 91 L65 83 Q68 91 65 99Z" fill="#5B5BD6"/><circle cx="50" cy="91" r="4.5" fill="#4342B0"/>`},
    {id:"flower",n:"Flower",vb:"62 11 34 34",svg:`${petals}<circle cx="79" cy="28" r="4.5" fill="#FFE680"/>`},
    {id:"phones",n:"Headphones",vb:"4 4 92 66",svg:`<path d="M16 52 C16 4 84 4 84 52" stroke="#1E1B3A" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="8" y="42" width="15" height="24" rx="7" fill="#5B5BD6"/><rect x="77" y="42" width="15" height="24" rx="7" fill="#5B5BD6"/>`},
    {id:"sparkle",n:"Sparkles",vb:"0 0 60 50",tile:`<path d="${star(22,22,14)}" fill="#FFD54F"/><path d="${star(46,14,8)}" fill="#8EC5FF"/><path d="${star(44,38,7)}" fill="#FF8FB1"/>`,svg:`<path d="${star(8,22,8)}" fill="#FFD54F"/><path d="${star(94,66,7)}" fill="#FFD54F"/><path d="${star(88,10,5)}" fill="#8EC5FF"/><path d="${star(6,78,5)}" fill="#FF8FB1"/>`}
  ]
};
const accOf=(part,id)=>ACC[part].find(a=>a.id===id);
const defaultM=()=>({name:"Tiko",color:"gold",eyes:"round",mouth:"smile",hat:null,glasses:null,extra:null});
const SPROUT=`<path d="M50 18 L50 12" stroke="#1E8E58" stroke-width="3" stroke-linecap="round"/><path d="M50 13 C44 3 33 5 32 11 C40 12 45 13 50 13Z" fill="#2BB673"/><path d="M50 13 C56 3 67 5 68 11 C60 12 55 13 50 13Z" fill="#45CC88"/>`;
function tiko(size=80,mood="happy",cfg){
  cfg=cfg||(S&&S.m)||defaultM();
  const c=COLORS[cfg.color]||COLORS.gold;
  let eyes=(EYES[cfg.eyes]||EYES.round).svg, face="";
  if(mood==="laugh"){eyes=ln("M32 43 L42 47 L32 51",INK,3.5)+ln("M68 43 L58 47 L68 51",INK,3.5);face=`<path d="M25 50 Q22 55 25 57 Q28 55 25 50Z" fill="#7CC4FF"/><path d="M75 50 Q72 55 75 57 Q78 55 75 50Z" fill="#7CC4FF"/>`}
  if(mood==="cheer")eyes=EYES.sparkly.svg;
  if(mood==="sad")face=ln("M31 39 L43 35",INK,3)+ln("M69 39 L57 35",INK,3)+`<path d="M31 54 Q27.5 60 31 62 Q34.5 60 31 54Z" fill="#7CC4FF"/>`;
  const mouth = mood==="sad" ? ln("M40 64 Q50 56 60 64") : mood==="wow" ? MOUTHS.ooh.svg : (mood==="laugh"||mood==="cheer") ? MOUTHS.grin.svg : (MOUTHS[cfg.mouth]||MOUTHS.smile).svg;
  const hat=cfg.hat&&accOf("hat",cfg.hat), gl=cfg.glasses&&accOf("glasses",cfg.glasses), ex=cfg.extra&&accOf("extra",cfg.extra);
  return `<svg width="${size}" height="${size}" viewBox="-10 -18 120 120" aria-hidden="true" style="flex:none;overflow:visible">
    ${hat?"":SPROUT}
    <circle cx="50" cy="57" r="36" fill="${c.dark}"/>
    <circle cx="50" cy="54" r="36" fill="${c.main}"/>

let L=null;
function startLesson(i){L={i,q:0,ok:0,sel:null,checked:false,t0:Date.now()};bud.mood="happy";newOrder();lessonRender();if(!PO())startTalk("lessonTalk",LESSON_TALK,"Let's gooo! 🚀")}
function newOrder(){L.order=shuffle(LESSONS[L.i].qs[L.q].o.map((_,k)=>k))}
function lessonRender(fx){
  const les=LESSONS[L.i], q=les.qs[L.q], pct=(L.q/les.qs.length)*100;
  const isRight=L.checked && L.order[L.sel]===q.a;
  infoCtx={key:`L${L.i}-${L.q}`,title:les.name,sub:`Question ${L.q+1} of ${les.qs.length}`,short:LINFO[L.i].s,long:LINFO[L.i].l,extra:`<b>This question:</b> ${q.why}`,hint:LHINT[L.i][L.q],answered:L.checked};
  const opts=L.order.map((k,pos)=>{
    let c="opt"; if(L.sel===pos)c+=" sel"; if(fx==="pick"&&L.sel===pos&&!PO())c+=" pop";
    if(L.checked){ if(k===q.a)c+=" right"; else if(L.sel===pos)c+=" wrong"; }
    return `<button class="${c}" onclick="pick(${pos})">${q.o[k]}</button>`}).join("");
  const fxin=(fx==="wave"||fx==="shake")&&!PO()?" fxin":"";
  const foot = !L.checked
    ? `<div class="ofoot"><button class="btn good" ${L.sel===null?"disabled":""} onclick="pushThen(this,checkAns)">CHECK</button></div>`
    : `<div class="ofoot ${isRight?"ok":"no"}${fxin}"><div class="fb" style="color:${isRight?"var(--okt)":"var(--not)"}">${isRight?"Nice one! 🎉":"Not quite…"}</div><p>${q.why}</p><button class="btn ${isRight?"good":"bad"}" onclick="nextQ()">CONTINUE</button></div>`;
  const talkEl=PO()?"":`<div class="bubble sm talk" id="lessonTalk"></div>`;
  openO(`<div class="ohead"><button class="x" onclick="closeO()" aria-label="Close">✕</button><div class="prog"><i style="width:${pct}%"></i></div>${infoBtn()}</div>
    <div class="obody${(fx==="wave"||fx==="shake")&&!PO()?" "+fx:""}"><div class="budrow"><div id="bud" class="bud" data-size="60">${tiko(60,bud.mood)}</div>${talkEl}</div>
    <div class="muted lname">${les.name.toUpperCase()}</div><div class="q">${q.q}</div>${opts}</div>${foot}`,{noWx:1});
  paintTalk(false);
}
function pick(p){if(L.checked)return;L.sel=p;lessonRender("pick")}
function checkAns(){
  L.checked=true; const ok=L.order[L.sel]===LESSONS[L.i].qs[L.q].a; if(ok)L.ok++;
  lessonRender(ok?"wave":"shake"); if(ok)confetti();
  if(ok){emote("cheer",1600);react(rand(R_OK))}
  else{const m=Math.random()<.5?"sad":"laugh";emote(m,2600);react(rand(m==="sad"?R_SAD:R_LAUGH))}
  if(S.set.intel)showInfoPop();
}
function nextQ(){
  L.q++;L.sel=null;L.checked=false;
  if(L.q<LESSONS[L.i].qs.length){newOrder();return lessonRender()}
  lessonDone();
}
function lessonDone(){
  const n=LESSONS[L.i].qs.length, pct=L.ok/n, xp=10+L.ok*5, secs=Math.round((Date.now()-L.t0)/1000);
  S.xp+=xp; if(L.i===S.done)S.done++; save(); stopTalk();
  const nextI=L.i+1<LESSONS.length?L.i+1:0;
  resultPopup({title:pct===1?"Perfect lesson! 🏆":pct>=.66?"Lesson complete! 🎉":pct>0?"You made it! 💪":"Oof, tough one 😅",sub:LESSONS[L.i].name,
    stats:[[`${L.ok}/${n}`,"correct"],[fmtTime(secs),"time"],[`+${xp}`,"XP"]],pct,noWx:true,
    buttons:[["CONTINUE LESSON",`startLesson(${nextI})`,"good"],["BACK TO HOME","backHome()","ghost"]]});
  if(pct>=.66)confetti();
}

function spark(c,w=110,h=44){
  const mx=Math.max(...c.chart),mn=Math.min(...c.chart);
  const pts=c.chart.map((v,i)=>`${(i/(c.chart.length-1))*w},${h-4-((v-mn)/(mx-mn||1))*(h-8)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

function rate(text,rd){
  const t=text.toLowerCase().trim();
  if(!t) return {k:"terrible",note:"Time ran out. Freezing up is also a decision — and usually a bad one."};
  if(t.length<6) return {k:"pbad",note:"Too short to be a real plan. Say what you'd do."};
  let s=0,hits=[];
  for(const [w,v] of Object.entries(rd.good)) if(t.includes(w)){s+=v;hits.push(w)}
  for(const [w,v] of Object.entries(rd.bad)) if(t.includes(w)){s+=v;hits.push(w)}
  if(/\b(because|so that|so we|to avoid|to protect|otherwise)\b/.test(t)) s+=1;
  const k = s>=5?"brilliant":s>=3?"excellent":s>=2?"best":s>=1?"pgood":s>=0?"pbad":"terrible";
  const notes={brilliant:"Outstanding! You saw the risk, acted on it and explained why.",excellent:"Strong move — you protected your firm.",best:"Solid, sensible decision.",pgood:"On the right track, but it could be sharper.",pbad:"Risky or unclear. This might hurt your firm.",terrible:"This move makes the crisis worse."};
  return {k,note:notes[k]};
}
function submitMove(timeout){

function analyzeMove(text,timeout){

  setTimeout(()=>{
    const res=rate(timeout?"":text,rd), r=R[res.k], before=G.val;
    G.val=Math.max(0,G.val+r.dv); G.log.push({k:res.k,text:text||"(no answer)"});
    let lost=false;
    if(res.k==="terrible"||G.val<=0){S.hearts=Math.max(0,S.hearts-1);S.broke=(S.broke||0)+1;lost=true;if(S.hearts===0)S.lockUntil=nextMidnight();save()}
    const over=G.val<=0||S.hearts===0||G.r===2;
    infoCtx={...infoCtx,answered:true};
    const good=["brilliant","excellent","best"].includes(res.k), bad=["pbad","terrible"].includes(res.k);
    openO(`${roundHead()}<div class="obody center${PO()?"":bad?" shake":" wave"}">
      <div class="badge" style="background:${r.col}">${r.sym}</div><h2 style="color:${r.col}">${r.label}</h2>
      <p class="muted" style="font-weight:700">${res.note}</p>
      <div class="card" style="text-align:left"><div class="muted" style="font-size:12px;font-weight:900">YOUR MOVE</div><p style="font-weight:800">“${esc(text||"(no answer)")}”</p>
      <div style="font-weight:900">Firm value: ${before} → <span style="color:${r.dv>=0?"var(--good)":"var(--bad)"}">${G.val} (${r.dv>=0?"+":""}${r.dv})</span></div>
      ${lost?`<div class="warn">You lost a heart ❤️ — ${S.hearts} left.</div>`:""}</div>
      <div class="hello" style="text-align:left"><div id="bud" class="bud" data-size="56">${tiko(56,"happy")}</div><div class="bubble"><b>Best move:</b>&nbsp;${rd.best}</div></div></div>
      <div class="ofoot"><button class="btn ${over?"sun":""}" onclick="${over?"endCase()":"G.r++;roundRender()"}">${over?"SEE GAME REVIEW":"NEXT ROUND"}</button></div>`);
    if(good)confetti();
    if(res.k==="terrible")emote(Math.random()<.5?"sad":"laugh",2800);
    else if(res.k==="pbad")emote("sad",2200);
    else if(res.k==="brilliant"||res.k==="excellent")emote("cheer",1800);
    if(S.set.intel)showInfoPop();
  },1100);
}

  return `<button class="backlink" onclick="closeSub()">‹ Settings</button><h2>Theme</h2><p class="muted" style="font-weight:700;margin-bottom:14px">Pick how Altifi looks.</p>
  <div class="themegrid">
    <button class="themecard ${t==="light"?"on":""}" onclick="setTheme('light')">${mock("light")}☀️ Light</button>
    <button class="themecard ${t==="night"?"on":""}" onclick="setTheme('night')">${mock("night")}🌙 Night</button>
  </div>
  <div class="sub">Your own picture</div>
  ${bgImg?`<div class="themegrid"><button class="themecard ${t==="image"?"on":""}" onclick="setTheme('image')">${mock("image")}🖼️ My picture</button><button class="upload" onclick="askPhotos()"><span>📷</span>Change picture<small>Pick another photo</small></button></div>`
   :`<button class="upload" onclick="askPhotos()"><span>📷</span>Upload Theme<small>Use a photo from your library as the background</small></button>`}`;
}
function setTheme(k){if(k==="image"&&!bgImg)return askPhotos();S.set.theme=k;save();applyTheme();render()}
function askPhotos(){
  if(S.set.photosOK)return $("#filein").click();
  $("#pmodal").innerHTML=`<div class="alertbg"><div class="permbox"><div class="pb"><div style="font-size:42px;line-height:1;margin-bottom:8px">🖼️</div><b>“Altifi” Would Like to Access Your Photos</b><p>Altifi uses the picture you choose as your app background.</p></div><div class="permbtns"><button onclick="closePerm()">Don’t Allow</button><button onclick="allowPhotos()">Allow</button></div></div></div>`;
}
function closePerm(){$("#pmodal").innerHTML=""}
function allowPhotos(){S.set.photosOK=true;save();closePerm();$("#filein").click()}
function gotPhoto(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,1400/Math.max(img.width,img.height)), cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    bgImg=cv.toDataURL("image/jpeg",.82); URL.revokeObjectURL(url);
    try{localStorage.setItem(KEY+"-bg",bgImg)}catch(e){}
    S.set.theme="image"; save(); applyTheme(); render();
  };
  img.onerror=()=>{URL.revokeObjectURL(url)};
  img.src=url;
}

pickWx();
updateWeather();
applyTheme();
render();
</script>
